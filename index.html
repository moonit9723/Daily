<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 올인원 라이프 로그</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('todo'); // todo, wishlist, diary

      // 1. 상태 관리 (LocalStorage 연동)
      const [todos, setTodos] = useState(() => JSON.parse(localStorage.getItem('my_todos')) || []);
      const [wishes, setWishes] = useState(() => JSON.parse(localStorage.getItem('my_wishes')) || []);
      const [diaries, setDiaries] = useState(() => JSON.parse(localStorage.getItem('my_diaries')) || []);

      // 입력 폼 상태들
      const [todoInput, setTodoInput] = useState('');
      const [wishInput, setWishInput] = useState({ name: '', price: '', link: '' });
      const [diaryInput, setDiaryInput] = useState({ title: '', content: '', mood: '😊', date: new Date().toISOString().substring(0, 10) });

      // LocalStorage 자동 저장
      useEffect(() => { localStorage.setItem('my_todos', JSON.stringify(todos)); }, [todos]);
      useEffect(() => { localStorage.setItem('my_wishes', JSON.stringify(wishes)); }, [wishes]);
      useEffect(() => { localStorage.setItem('my_diaries', JSON.stringify(diaries)); }, [diaries]);

      // --- [1. 할 일 핸들러] ---
      const addTodo = (e) => {
        e.preventDefault();
        if (!todoInput.trim()) return;
        setTodos([{ id: Date.now(), text: todoInput, done: false }, ...todos]);
        setTodoInput('');
      };
      const toggleTodo = (id) => setTodos(todos.map(t => t.id === id ? { ...t, done: !t.done } : t));
      const deleteTodo = (id) => setTodos(todos.filter(t => t.id !== id));

      // --- [2. 위시리스트 핸들러] ---
      const addWish = (e) => {
        e.preventDefault();
        if (!wishInput.name.trim()) return;
        setWishes([{ id: Date.now(), ...wishInput }, ...wishes]);
        setWishInput({ name: '', price: '', link: '' });
      };
      const deleteWish = (id) => setWishes(wishes.filter(w => w.id !== id));

      // --- [3. 일기장 핸들러] ---
      const addDiary = (e) => {
        e.preventDefault();
        if (!diaryInput.title.trim() || !diaryInput.content.trim()) return;
        setDiaries([{ id: Date.now(), ...diaryInput }, ...diaries]);
        setDiaryInput({ title: '', content: '', mood: '😊', date: new Date().toISOString().substring(0, 10) });
      };
      const deleteDiary = (id) => setDiaries(diaries.filter(d => d.id !== id));

      return (
        <div className="max-w-2xl mx-auto p-4 space-y-6">
          {/* 헤더 */}
          <header className="text-center pt-6 pb-2">
            <h1 className="text-2xl font-bold text-stone-800">✨ My Daily Dashboard</h1>
            <p className="text-xs text-stone-500 mt-1">할 일, 사고 싶은 것, 오늘의 기록을 한곳에서</p>
          </header>

          {/* 3개 탭 버튼 */}
          <nav className="flex bg-stone-200/70 p-1 rounded-2xl">
            <button
              onClick={() => setActiveTab('todo')}
              className={`flex-1 py-2.5 text-sm font-medium rounded-xl transition-all ${
                activeTab === 'todo' ? 'bg-white text-stone-800 shadow-sm font-bold' : 'text-stone-500 hover:text-stone-700'
              }`}
            >
              ✅ 할 일 ({todos.filter(t => !t.done).length})
            </button>
            <button
              onClick={() => setActiveTab('wishlist')}
              className={`flex-1 py-2.5 text-sm font-medium rounded-xl transition-all ${
                activeTab === 'wishlist' ? 'bg-white text-stone-800 shadow-sm font-bold' : 'text-stone-500 hover:text-stone-700'
              }`}
            >
              🎁 위시리스트 ({wishes.length})
            </button>
            <button
              onClick={() => setActiveTab('diary')}
              className={`flex-1 py-2.5 text-sm font-medium rounded-xl transition-all ${
                activeTab === 'diary' ? 'bg-white text-stone-800 shadow-sm font-bold' : 'text-stone-500 hover:text-stone-700'
              }`}
            >
              📖 일기장 ({diaries.length})
            </button>
          </nav>

          {/* 탭 1: 해야 할 일 (To-Do) */}
          {activeTab === 'todo' && (
            <div className="space-y-4">
              <form onSubmit={addTodo} className="flex gap-2">
                <input
                  type="text"
                  placeholder="오늘 해야 할 일을 입력하세요..."
                  value={todoInput}
                  onChange={(e) => setTodoInput(e.target.value)}
                  className="flex-1 px-4 py-2.5 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 bg-white"
                />
                <button type="submit" className="px-5 py-2.5 bg-stone-800 text-white text-sm font-medium rounded-xl hover:bg-stone-700">
                  추가
                </button>
              </form>

              <div className="space-y-2">
                {todos.length === 0 && <p className="text-center py-8 text-xs text-stone-400">등록된 할 일이 없습니다.</p>}
                {todos.map(t => (
                  <div key={t.id} className="bg-white p-3.5 rounded-xl border border-stone-100 flex items-center justify-between shadow-sm">
                    <label className="flex items-center space-x-3 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={t.done}
                        onChange={() => toggleTodo(t.id)}
                        className="w-4 h-4 rounded text-amber-600 focus:ring-amber-500"
                      />
                      <span className={`text-sm ${t.done ? 'line-through text-stone-400' : 'text-stone-700'}`}>{t.text}</span>
                    </label>
                    <button onClick={() => deleteTodo(t.id)} className="text-xs text-rose-400 hover:text-rose-600">삭제</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 탭 2: 위시리스트 (Wishlist) */}
          {activeTab === 'wishlist' && (
            <div className="space-y-4">
              <form onSubmit={addWish} className="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                <input
                  type="text"
                  placeholder="갖고 싶은 아이템 이름 *"
                  value={wishInput.name}
                  onChange={(e) => setWishInput({ ...wishInput, name: e.target.value })}
                  className="w-full px-3.5 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50"
                />
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="예상 가격 (예: 35,000원)"
                    value={wishInput.price}
                    onChange={(e) => setWishInput({ ...wishInput, price: e.target.value })}
                    className="flex-1 px-3.5 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50"
                  />
                  <input
                    type="url"
                    placeholder="구매 링크 (선택)"
                    value={wishInput.link}
                    onChange={(e) => setWishInput({ ...wishInput, link: e.target.value })}
                    className="flex-1 px-3.5 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50"
                  />
                </div>
                <button type="submit" className="w-full py-2 bg-stone-800 text-white text-xs font-semibold rounded-xl hover:bg-stone-700">
                  위시리스트에 담기
                </button>
              </form>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {wishes.length === 0 && <p className="col-span-full text-center py-8 text-xs text-stone-400">위시리스트가 비어있습니다.</p>}
                {wishes.map(w => (
                  <div key={w.id} className="bg-white p-4 rounded-2xl border border-stone-100 shadow-sm flex flex-col justify-between">
                    <div>
                      <h4 className="font-bold text-sm text-stone-800">{w.name}</h4>
                      {w.price && <p className="text-xs font-semibold text-amber-700 mt-1">{w.price}</p>}
                    </div>
                    <div className="flex justify-between items-center mt-3 pt-2 border-t border-stone-50">
                      {w.link ? (
                        <a href={w.link} target="_blank" rel="noreferrer" className="text-xs text-blue-500 hover:underline">
                          🔗 링크 이동
                        </a>
                      ) : <span />}
                      <button onClick={() => deleteWish(w.id)} className="text-xs text-rose-400 hover:text-rose-600">삭제</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 탭 3: 일기장 (Diary) */}
          {activeTab === 'diary' && (
            <div className="space-y-4">
              <form onSubmit={addDiary} className="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm space-y-3">
                <div className="flex gap-2">
                  <input
                    type="date"
                    value={diaryInput.date}
                    onChange={(e) => setDiaryInput({ ...diaryInput, date: e.target.value })}
                    className="border border-stone-200 rounded-xl p-2 text-xs"
                  />
                  <select
                    value={diaryInput.mood}
                    onChange={(e) => setDiaryInput({ ...diaryInput, mood: e.target.value })}
                    className="border border-stone-200 rounded-xl p-2 text-xs bg-white"
                  >
                    <option value="😊">😊 기쁨</option>
                    <option value="🎉">🎉 축하</option>
                    <option value="☕">☕ 여유</option>
                    <option value="🌿">🌿 힐링</option>
                    <option value="😭">😭 슬픔</option>
                  </select>
                </div>
                <input
                  type="text"
                  placeholder="일기 제목"
                  value={diaryInput.title}
                  onChange={(e) => setDiaryInput({ ...diaryInput, title: e.target.value })}
                  className="w-full px-3.5 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50"
                />
                <textarea
                  rows="3"
                  placeholder="오늘 하루는 어땠나요?"
                  value={diaryInput.content}
                  onChange={(e) => setDiaryInput({ ...diaryInput, content: e.target.value })}
                  className="w-full px-3.5 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500/50 resize-none"
                />
                <button type="submit" className="w-full py-2 bg-stone-800 text-white text-xs font-semibold rounded-xl hover:bg-stone-700">
                  일기 저장하기
                </button>
              </form>

              <div className="space-y-3">
                {diaries.length === 0 && <p className="text-center py-8 text-xs text-stone-400">작성된 일기가 없습니다.</p>}
                {diaries.map(d => (
                  <div key={d.id} className="bg-white p-4 rounded-2xl border border-stone-100 shadow-sm space-y-1">
                    <div className="flex justify-between items-center text-xs text-stone-400">
                      <span>{d.date} {d.mood}</span>
                      <button onClick={() => deleteDiary(d.id)} className="text-rose-400 hover:text-rose-600">삭제</button>
                    </div>
                    <h3 className="font-bold text-stone-800 text-sm">{d.title}</h3>
                    <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-wrap">{d.content}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
