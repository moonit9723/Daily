<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 일상 기록 다이어리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-amber-50/40 text-stone-800 font-sans pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [logs, setLogs] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [mood, setMood] = useState('😊');
      const [date, setDate] = useState(new Date().toISOString().substring(0, 10));

      useEffect(() => {
        const saved = localStorage.getItem('daily_logs');
        if (saved) setLogs(JSON.parse(saved));
      }, []);

      const saveLogs = (newLogs) => {
        setLogs(newLogs);
        localStorage.setItem('daily_logs', JSON.stringify(newLogs));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) return;
        const newLog = { id: Date.now(), title, content, mood, date };
        saveLogs([newLog, ...logs]);
        setTitle('');
        setContent('');
      };

      const handleDelete = (id) => {
        saveLogs(logs.filter(log => log.id !== id));
      };

      return (
        <div className="max-w-2xl mx-auto p-4 space-y-6">
          <header className="py-4 border-b text-center">
            <h1 className="text-2xl font-bold text-stone-800">📖 나만의 일상 기록 다이어리</h1>
          </header>

          <form onSubmit={handleSubmit} className="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
            <div className="flex gap-2">
              <input 
                type="date" 
                value={date} 
                onChange={(e) => setDate(e.target.value)}
                className="border rounded-xl p-2 text-sm"
              />
              <select value={mood} onChange={(e) => setMood(e.target.value)} className="border rounded-xl p-2 text-sm">
                <option value="😊">😊 기쁨</option>
                <option value="🎉">🎉 축하</option>
                <option value="☕">☕ 여유</option>
                <option value="🌿">🌿 힐링</option>
                <option value="😭">😭 슬픔</option>
              </select>
            </div>
            <input 
              type="text" 
              placeholder="일기 제목" 
              value={title} 
              onChange={(e) => setTitle(e.target.value)}
              className="w-full border rounded-xl p-2.5 text-sm"
            />
            <textarea 
              rows="4" 
              placeholder="오늘 하루는 어땠나요?" 
              value={content} 
              onChange={(e) => setContent(e.target.value)}
              className="w-full border rounded-xl p-2.5 text-sm"
            />
            <button type="submit" className="w-full bg-stone-800 text-white py-2.5 rounded-xl font-medium text-sm">
              일기 저장하기
            </button>
          </form>

          <div className="space-y-3">
            {logs.map(log => (
              <div key={log.id} className="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-start">
                <div>
                  <div className="text-xs text-stone-400 mb-1">{log.date} {log.mood}</div>
                  <h3 className="font-bold text-stone-800">{log.title}</h3>
                  <p className="text-sm text-stone-600 mt-1">{log.content}</p>
                </div>
                <button onClick={() => handleDelete(log.id)} className="text-xs text-rose-500 hover:underline">삭제</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
